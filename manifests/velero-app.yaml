apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-backup
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://vmware-tanzu.github.io/helm-charts'
    targetRevision: 7.0.0 # Version du chart Helm
    chart: velero
    helm:
      values: |
        # 1. Ajout du plugin Azure indispensable
        # v1.10.0+ required: v1.9.0 is built against velero v1.13.0, whose LoadCredentials()
        # always errors on an empty credentials file, breaking Workload Identity (no-secret) auth
        initContainers:
          - name: velero-plugin-for-microsoft-azure
            image: velero/velero-plugin-for-microsoft-azure:v1.10.0
            volumeMounts:
              - mountPath: /target
                name: plugins
        
        # 2. Configuration du stockage Azure
        configuration:
          backupStorageLocation:
            - name: default
              provider: azure
              bucket: velero # Nom du conteneur créé par Terraform
              config:
                resourceGroup: tenjalbertRG
                storageAccount: adsstgnonproductiw993
                subscriptionId: 5e683e0f-b00c-48d6-9769-5aaf598de8f1
                useAAD: "true" # Indique l'utilisation de l'authentification Azure Active Directory
          
          volumeSnapshotLocation:
            - name: default
              provider: azure
              config:
                resourceGroup: tenjalbertRG

          # Le VolumeSnapshotter exige toujours AZURE_SUBSCRIPTION_ID/AZURE_RESOURCE_GROUP
          # via un fichier de credentials, même sous Workload Identity (cf. extraObjects ci-dessous).
          extraEnvVars:
            - name: AZURE_CREDENTIALS_FILE
              value: /credentials/vsl/cloud
        
        # 3. Zéro credential (pas de secret, l'identité Workload Identity est utilisée)
        credentials:
          useSecret: false

        # 3bis. Fichier de credentials minimal (IDs non sensibles uniquement) pour le VolumeSnapshotter
        extraObjects:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: velero-vsl-ids
              namespace: velero
            type: Opaque
            stringData:
              cloud: |
                AZURE_SUBSCRIPTION_ID=5e683e0f-b00c-48d6-9769-5aaf598de8f1
                AZURE_RESOURCE_GROUP=tenjalbertRG

        extraVolumes:
          - name: vsl-ids
            secret:
              secretName: velero-vsl-ids
        extraVolumeMounts:
          - name: vsl-ids
            mountPath: /credentials/vsl
            readOnly: true

        # 4. Configuration du ServiceAccount et de l'identité managée
        serviceAccount:
          server:
            create: true
            name: velero
            annotations:
              azure.workload.identity/client-id: "34f92443-ad07-4086-b9b6-5fb78d6e2cd0"
        
        podLabels:
          azure.workload.identity/use: "true"
          
        podAnnotations:
          azure.workload.identity/inject: "true"

        # 5. Forcer une version spécifique pour éviter l'erreur ImagePullBackOff
        kubectl:
          image:
            repository: bitnamilegacy/kubectl
            tag: "1.32.2"

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true